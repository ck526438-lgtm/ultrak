name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

jobs:
  tests:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.8", "3.12"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - name: ffmpeg (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: ffmpeg (Windows)
        if: runner.os == 'Windows'
        run: choco install ffmpeg -y --no-progress

      - name: dependances de test
        run: python -m pip install --upgrade pip "pytest>=7"

      - name: tests unites + integration
        run: python -m pytest -q

      - name: lint des filtres ffmpeg
        run: python tools/lint_filters.py ffmpeg

  release:
    needs: tests
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Archive source
        run: |
          zip -r ultrak-source.zip src tools tests ultrak.py Launch.bat README.md LICENSE pyproject.toml
      - uses: softprops/action-gh-release@v2
        with:
          files: ultrak-source.zip
